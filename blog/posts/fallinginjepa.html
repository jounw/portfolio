        <h1>Fall for JEPA</h1>
      <span class="post-date">November 15, 2026</span>
    </header>

<script type="text/markdown">
A few days ago, I was on a bus during a school field trip, watching YouTube. One recommended video caught my attention: an hour-and-twenty-minute invited talk at Stanford. [Click here](https://youtu.be/GBd7iuJkW08?si=Nm2wUEiKWiT-yw2y) to watch it. In the talk, the speaker presented [Causal-JEPA](https://arxiv.org/abs/2602.11389) (C-JEPA) and argued that object-level masking forces a world model to learn the interactions between objects, rather than relying on shortcuts. I don't know why, but I hadn't seen a video that interesting in a long time. I was fascinated by [JEPA](https://openreview.net/forum?id=BZ5a1r-kVsf).

After that, I wanted to learn more about JEPA, so I started researching it. I couldn't get it out of my head. I was so into it that I couldn't pay attention in class. I know it's inappropriate to do other things during class, but I couldn't stop myself from reading the JEPA paper. It was just fascinating. While studying it, I came across some concepts I'd never heard of, e.g., [slot attention](https://arxiv.org/abs/2006.15055). So, without much thinking, I printed the slot attention paper and read it. That was interesting too.
