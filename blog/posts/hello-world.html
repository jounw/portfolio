## Writing a post

Each post is a file in `blog/posts/`. Copy `_template.html`, write the body in Markdown, and add a line to the list in `blog/index.html`.

Use triple backticks for a code block, with the language after them:

```python
def hello():
    print("hello, world")

class Greeter:
    def __init__(self, name: str):
        self.name = name  # a comment

    def greet(self) -> str:
        return f"Hello, {self.name}! {1 + 2}"
```

Inline code like `np.linalg.norm(x)` uses single backticks. **Bold**, *italic*, [links](https://example.com), lists and images work too:
